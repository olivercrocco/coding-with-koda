<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding with Koda</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1f2933; --muted: #5f6b7a; --line: #dfe3e8;
    --accent: #1f3a93; --accent-2: #b03a2e; --chip: #eef1f5;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 var(--font); color: var(--ink); background: var(--bg);
         display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 260px 1fr 360px; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: 0.2px; }
  header h1 span { color: var(--muted); font-weight: 400; margin-left: 10px; font-size: 14px; }
  header .spacer { flex: 1; }
  header button, .btn { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; color: var(--ink); }
  header button:hover, .btn:hover { border-color: #b8c0ca; background: #f8f9fb; }
  .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #sidebar { border-right: 1px solid var(--line); background: #fff; overflow: auto; padding: 10px 0 30px; }
  #problem-select { display: none; }
  .group-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 14px 16px 6px; }
  #problem-list .item { display: flex; align-items: center; gap: 8px; padding: 7px 16px; color: var(--ink); text-decoration: none; font-size: 13.5px; border-left: 3px solid transparent; }
  #problem-list .item:hover { background: #f5f7fa; }
  #problem-list .item.active { background: #eef2fb; border-left-color: var(--accent); font-weight: 600; }
  #problem-list .item-title { flex: 1; }
  .tag { font-size: 10.5px; color: var(--muted); background: var(--chip); padding: 1px 6px; border-radius: 10px; }
  #viewport { position: relative; overflow: hidden; background: #fbfbf9; }
  #viewport canvas { display: block; }
  #panel { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px 40px; }
  body.panel-hidden { grid-template-columns: 260px 1fr 0; }
  body.panel-hidden #panel { display: none; }
  .p-source { font-size: 12px; color: var(--muted); }
  #panel h2 { font-size: 17px; margin: 2px 0 10px; line-height: 1.3; }
  .p-statement { margin-bottom: 8px; }
  .p-parts { margin: 0 0 10px; padding-left: 22px; }
  .p-parts li { margin-bottom: 4px; }
  .p-note { font-size: 13px; color: #6b4e16; background: #fff7e0; border: 1px solid #f1dfa6; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; }
  .ctl-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .ctl-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chk { display: flex; align-items: flex-start; gap: 8px; margin: 5px 0; font-size: 13.5px; cursor: pointer; }
  .chk input { margin-top: 3px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .step-row { display: flex; align-items: center; gap: 10px; }
  .step-n { font-size: 13px; color: var(--muted); flex: 1; text-align: center; }
  .step-cap { margin-top: 8px; font-size: 13.5px; }
  .param { margin: 8px 0; }
  .param label { display: block; font-size: 13px; margin-bottom: 3px; }
  .param-inputs { display: flex; gap: 8px; align-items: center; }
  .param-inputs input[type=range] { flex: 1; }
  .param-inputs input[type=number] { width: 84px; font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; }
  .think ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
  .think li { margin-bottom: 6px; }
  .error { color: #b00020; padding: 12px; }
  /* 3D labels */
  .lbl { font: 13px/1.1 "Times New Roman", Times, serif; color: #1a1a1a; white-space: nowrap; pointer-events: none;
         text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff; user-select: none; }
  .lbl-in { display: inline-block; }
  .lbl-force { font-size: 15px; color: #1f3a93; }
  .lbl-force .lbl-in, .lbl-comp .lbl-in { transform: translate(38%, -42%); }
  .lbl-axis { font-size: 16px; }
  .lbl-x { color: #c0392b; } .lbl-y { color: #1e8449; } .lbl-z { color: #1f5fbf; }
  .lbl-comp { font-size: 12.5px; }
  .lbl-res { color: #555; }
  .lbl-dim, .lbl-angle { font-size: 12.5px; color: #333; }
  .lbl-point { font-size: 14px; font-style: italic; }
  .lbl-member { font-size: 12.5px; color: #333; }
  .lbl-note { font-size: 12px; color: #444; font-family: var(--font); }
  .coords { font-style: normal; font-size: 11.5px; color: #555; font-family: var(--font); }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  @media (max-width: 980px) {
    body { grid-template-rows: 52px 44px 52vh 1fr; grid-template-columns: 1fr; height: auto; overflow: auto; }
    header { grid-column: 1; }
    #sidebar { border-right: none; border-bottom: 1px solid var(--line); padding: 6px 12px; overflow: visible; }
    #problem-list { display: none; }
    #problem-select { display: block; width: 100%; font: inherit; font-size: 14px; padding: 6px; }
    #viewport { min-height: 52vh; }
    #panel { border-left: none; border-top: 1px solid var(--line); }
    body.panel-hidden { grid-template-columns: 1fr; }
    #toggle-panel { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>Coding with Koda <span>Statics in 3D: CE 2450 problems you can turn over in your hands</span></h1>
  <div class="spacer"></div>
  <button id="toggle-panel" title="Hide or show the side panel">Panel</button>
</header>
<nav id="sidebar">
  <select id="problem-select" aria-label="Choose a problem"></select>
  <div id="problem-list"></div>
</nav>
<main id="viewport"><div id="loading">Loading the 3D viewer…</div></main>
<aside id="panel"></aside>

<script src="problems.js"></script>
<script src="engine.js"></script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
  const loading = document.getElementById('loading');
  try {
    window.StaticsApp.start({ THREE, OrbitControls, CSS2DRenderer, CSS2DObject });
    loading.remove();
  } catch (e) {
    loading.textContent = 'The viewer could not start: ' + e.message;
    console.error(e);
  }
</script>
<noscript>This page needs JavaScript and an internet connection (it loads three.js from a CDN).</noscript>
</body>
</html>
